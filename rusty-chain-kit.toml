# para.toml: the source of truth for every repo para manages.
#
# Each [[repo]] records WHERE it comes from (upstream URL + branch) and HOW we keep our copy:
#
#   upstream      canonical GitHub URL. para keeps a git remote named `remote` (default "upstream") pointing here.
#   branch        upstream branch we track.
#   local_branch  YOUR branch. Defaults to `branch`. Set it to e.g. "para/local" to carry your own patches;
#                 `para repos sync` replays them on top of upstream every time.
#   strategy      how to update local_branch from upstream/branch: "rebase" (default), "merge", or "ff" (fast-forward only).
#   fork          optional URL of your own fork. With `push = true`, sync pushes local_branch there (force-with-lease).
#   build         how to build the repo's binaries (linked into <root>/.para/bin).
#
# Paths are relative to [workspace].root, which is relative to this file.

[workspace]
root = ".."
state_dir = ".para"
# build_jobs = 8      # cargo -j for builds (default: all cores minus two)

# ─────────────────────────────── Original Paradigm-ecosystem checkouts ───────────────────────────────

[[repo]]
name = "foundry"
path = "foundry"
upstream = "https://github.com/foundry-rs/foundry.git"
branch = "master"
category = "toolkit"
description = "forge / cast / anvil / chisel: build, test, deploy, poke chains, local devnet, Solidity REPL"
build = { kind = "cargo", packages = ["forge", "cast", "anvil", "chisel"], bins = ["forge", "cast", "anvil", "chisel"] }

[[repo]]
name = "reth"
path = "reth"
upstream = "https://github.com/paradigmxyz/reth.git"
branch = "main"
category = "node"
description = "Modular, high-performance Ethereum execution client"
build = { kind = "cargo", packages = ["reth"], bins = ["reth"] }

[[repo]]
name = "alloy"
path = "alloy"
upstream = "https://github.com/alloy-rs/alloy.git"
branch = "main"
category = "library"
description = "Rust Ethereum library: providers, signers, RPC types (para links against this checkout)"

[[repo]]
name = "solar"
path = "solar"
upstream = "https://github.com/paradigmxyz/solar.git"
branch = "main"
category = "compiler"
description = "Blazingly fast Solidity compiler and linter written in Rust"
build = { kind = "cargo", packages = ["solar-compiler"], bins = ["solar"] }

[[repo]]
name = "cryo"
path = "cryo"
upstream = "https://github.com/paradigmxyz/cryo.git"
branch = "main"
category = "data"
description = "Extract blockchain data to parquet / csv / json"
build = { kind = "cargo", packages = ["cryo_cli"], bins = ["cryo"] }

[[repo]]
name = "viem"
path = "viem"
upstream = "https://github.com/wevm/viem.git"
branch = "main"
category = "library"
description = "TypeScript interface for Ethereum (powers the GUI wallet + utilities and `para new script`)"

[[repo]]
name = "artemis"
path = "artemis"
upstream = "https://github.com/paradigmxyz/artemis.git"
branch = "main"
category = "framework"
description = "MEV bot framework (archived upstream; ported to alloy by `para new bot`)"

# ─────────────────────────────── Extra tools cloned by para ───────────────────────────────

[[repo]]
name = "mesc"
path = "mesc"
upstream = "https://github.com/paradigmxyz/mesc.git"
branch = "main"
category = "config"
description = "Multiple Endpoint Shared Configuration: one RPC config for every tool (para reads it natively)"
build = { kind = "cargo", manifest_dir = "rust", packages = ["mesc_cli"], bins = ["mesc"] }

[[repo]]
name = "heimdall"
path = "heimdall-rs"
upstream = "https://github.com/Jon-Becker/heimdall-rs.git"
branch = "main"
category = "analysis"
description = "EVM bytecode decompiler, disassembler, calldata decoder, CFG generator"
build = { kind = "cargo", packages = ["heimdall-cli"], bins = ["heimdall"] }

[[repo]]
name = "revm"
path = "revm"
upstream = "https://github.com/bluealloy/revm.git"
branch = "main"
category = "evm"
description = "Rust EVM used by foundry & reth; `revme` runs state tests and raw bytecode"
build = { kind = "cargo", packages = ["revme"], bins = ["revme"] }

[[repo]]
name = "aderyn"
path = "aderyn"
upstream = "https://github.com/Cyfrin/aderyn.git"
branch = "dev"
category = "analysis"
description = "Solidity static analyzer (security findings report)"
build = { kind = "cargo", packages = ["aderyn"], bins = ["aderyn"] }
